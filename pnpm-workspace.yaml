packages:
  - apps/*
  - components/*
  - foundations/*
  - themes/*
  - packages/*

catalogMode: prefer

# `vite` is Vite+ under an alias: the toolchain ships under its own name and is installed here in
# place of Vite, which is why this is an alias rather than a range.
catalog:
  "@ark-ui/react": ^5.39.0
  "@arethetypeswrong/core": ^0.18.5
  "@chakra-ui/cli": ^3.36.0
  "@chakra-ui/react": ^3.36.0
  "@emotion/react": ^11.14.0
  "@fontsource-variable/fira-code": ^5.3.0
  "@fontsource-variable/jost": ^5.3.0
  "@fontsource-variable/literata": ^5.3.0
  "@fontsource-variable/source-code-pro": ^5.3.0
  "@fontsource-variable/space-grotesk": ^5.3.0
  "@fontsource-variable/spline-sans-mono": ^5.3.0
  "@stealthscale/vite-config": ^0.1.4
  "@stealthscale/vite-config-core": ^0.2.0
  "@stealthscale/vite-config-react": ^0.3.0
  "@stealthscale/vite-config-typescript": ^0.1.1
  "@stealthscale/testing": ^0.1.0
  "@stealthscale/vite-plugin-sbom": ^0.2.0
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@testing-library/react": ^16.3.3
  "@testing-library/user-event": ^14.6.1
  "@vitejs/plugin-react": ^6.1.1
  "@vitest/coverage-v8": 4.1.11
  lucide-react: ^1.41.0
  eslint-plugin-jsdoc: ^64.3.4
  eslint-plugin-perfectionist: ^5.11.0
  eslint-plugin-tsdoc: ^0.5.2
  happy-dom: ^20.14.3
  oxc-transform-react: ^0.149.0
  publint: ^0.3.24
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1

# What a published package asks a consumer for. Separate from the default catalog because that one
# aliases `vite` to Vite+, and a package manager writes a catalog entry into the published manifest
# verbatim: peering on the default would tell a consumer to install Vite+ under the name `vite`.
catalogs:
  peer:
    vite: ^8.0.0

overrides:
  vite@*: "catalog:"

# `vite` here is Vite+ under an alias, so its version reads as 0.3.1 and every package asking for a
# real Vite range reports an unmet peer. The range they ask for is satisfied; the number they read
# is not the one they are checking against.
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

minimumReleaseAgeExclude:
  - "@stealthscale/testing@0.1.0"
  - "@stealthscale/vite-config-core@0.2.0"
  - "@stealthscale/vite-config-react@0.1.0 || 0.1.1 || 0.2.0 || 0.3.0"
  - "@stealthscale/vite-config-typescript@0.1.1"
  - "@stealthscale/vite-config@0.1.1 || 0.1.2 || 0.1.3 || 0.1.4"
  - "@stealthscale/vite-plugin-base@0.1.1"
  - "@stealthscale/vite-plugin-sbom@0.2.0"
  - yaml@2.9.1

allowBuilds:
  esbuild: true

# Chakra's typegen loads the theme config by bundling it, and esbuild is how it does that. Node
# reads the file natively now and the generators that would let us skip the bundling are sealed
# behind the CLI's exports map, so this is not avoidable from here — @pandacss/dev carries the same
# dependency for the same reason. It reaches `themes/base` alone, which is the only package that
# runs typegen, and nothing ships it.
